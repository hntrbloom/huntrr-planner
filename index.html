<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Huntrr Space</title>
    <meta name="description" content="A mindful digital stationery planner combining tactile paper planning with digital efficiency." />
    <meta property="og:title" content="Huntrr Space" />
    <meta property="og:description" content="A mindful digital stationery planner combining tactile paper planning with digital efficiency." />
    <script>
      // Suppress Vite HMR / WebSocket connection errors in sandbox iframe environment
      window.addEventListener('error', function(event) {
        if (
          event.filename && event.filename.includes('@vite/client') ||
          (event.message && (event.message.includes('WebSocket') || event.message.includes('vite') || event.message.includes('ws:')))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = String(event.reason?.message || event.reason || '');
        if (reason.includes('WebSocket') || reason.includes('vite') || reason.includes('ws:')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
